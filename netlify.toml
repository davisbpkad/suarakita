[build]
  publish = "public"
  command = "npm run build"
  functions = "netlify/functions"

# Environment defaults
[build.environment]
  NODE_VERSION = "20"

# API rewrites: forward /api/... to Netlify Serverless Functions
[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/correct-transcript"
  to = "/.netlify/functions/correct-transcript"
  status = 200

[[redirects]]
  from = "/api/meeting-notes"
  to = "/.netlify/functions/meeting-notes"
  status = 200

[[redirects]]
  from = "/api/generate-meeting-notes"
  to = "/.netlify/functions/meeting-notes"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), microphone=(self)"
    # Lapisan kedua untuk XSS. 'unsafe-inline' pada style diperlukan karena Vue
    # memasang atribut style langsung (mis. lebar bar level mikrofon).
    # script-src tanpa 'unsafe-eval' aman: template Vue sudah dikompilasi saat build.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/build/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/build/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

